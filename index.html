<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Portal Aspirasi Astatid PPMU</title>
  <meta name="description"
    content="Formulir resmi penyampaian kendala, usulan solusi, dan evaluasi berkala untuk lembaga formal Yayasan Miftahul Ulum.">
  <link rel="icon" type="image/png" href="logo_santri.png">
  <!-- Production Compiled Tailwind CSS -->
  <link rel="stylesheet" href="dist.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --primary-green: #15803d;
      --primary-dark: #0f2e1b;
      --surface-cream: #fafaf9;
    }

    /* Anti-zoom & Mobile App Feel */
    html, body {
      touch-action: pan-x pan-y;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overscroll-behavior-y: none;
    }

    body,
    button,
    input,
    textarea,
    select {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Mencegah auto-zoom iOS Safari saat fokus input/textarea (wajib min 16px di mobile) */
    @media (max-width: 640px) {
      input, textarea, select {
        font-size: 16px !important;
      }
    }

    .font-arabic {
      font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade New', serif;
      direction: rtl;
      unicode-bidi: isolate;
    }

    body {
      background-color: #f7f9f6;
      color: #1c261e;
    }

    .font-heading {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .quote-fade {
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .field-control {
      min-height: 48px;
    }

    /* Subtle institutional mesh effect for the background */
    .hero-glow {
      background: radial-gradient(circle at 50% -20%, rgba(34, 197, 94, 0.12) 0%, rgba(247, 249, 246, 0) 65%);
    }

    /* Minimalist focus states without harsh double outline */
    input:focus-visible,
    textarea:focus-visible {
      outline: none;
    }

    button:focus-visible {
      outline: 2px solid #15803d;
      outline-offset: 2px;
    }
  </style>
</head>

<body
  class="min-h-screen flex flex-col justify-between antialiased selection:bg-emerald-900 selection:text-emerald-50 hero-glow">

  <!-- Header (Terpusat, Bersih Tanpa Card / Nav Bar) -->
  <header class="w-full pt-6 sm:pt-8 pb-1">
    <div class="max-w-2xl mx-auto px-4 flex flex-col items-center text-center">
      <img src="logo_santri.png" alt="Logo PP. Miftahul Ulum"
        class="w-10 h-10 sm:w-11 sm:h-11 object-contain mb-2 drop-shadow-sm" width="44" height="44">
      <h1 class="text-xs sm:text-sm font-extrabold text-emerald-800 tracking-tight leading-tight">
        PP. MIFTAHUL ULUM
      </h1>
      <p class="text-[11px] sm:text-xs text-stone-500 font-medium mt-0.5">
        Banyuputih Kidul Jatiroto Lumajang
      </p>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="w-full max-w-2xl mx-auto px-4 sm:px-6 pb-12 flex-1 flex flex-col">

    <!-- Judul Halaman -->
    <div class="mt-3 mb-2 text-center">
      <h2 class="font-heading text-2xl sm:text-3xl font-extrabold tracking-tight text-stone-900">
        Aspirasi Asatidz
      </h2>
    </div>

    <!-- Kutipan Teks Murni (Tanpa Card / Tooltip) -->
    <div class="mb-5 text-center min-h-[28px] flex items-center justify-center">
      <div id="quoteDisplay" class="quote-fade opacity-100">
        <!-- Teks berganti dinamis di sini -->
      </div>
    </div>

    <!-- Kartu Formulir -->
    <div class="bg-white border border-stone-200/90 rounded-2xl shadow-sm p-5 sm:p-7">
      <form id="aspirasiForm" class="space-y-5" novalidate>

        <!-- 1. Pilihan Asrama/Instansi (Autocomplete Input) -->
        <div class="space-y-1.5 relative" id="autocompleteContainer">
          <label for="instansiInput" class="block text-xs font-semibold text-stone-600">
            Asrama/Instansi <span class="text-emerald-700" aria-label="Wajib">*</span>
          </label>

          <div class="relative">
            <input type="text" name="instansi" id="instansiInput" autocomplete="off" required
              placeholder="Ketik nama asrama atau instansi..."
              class="field-control w-full rounded-xl border border-stone-300/80 bg-stone-50/60 hover:bg-stone-50 px-3.5 py-2.5 text-sm text-stone-900 placeholder:text-stone-400 transition focus:bg-white focus:border-emerald-700 focus:ring-0">
            <div id="clearInstansiBtn"
              class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-stone-400 hover:text-stone-600 cursor-pointer p-1">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </div>
          </div>

          <!-- Dropdown Saran Melayang (Hidden secara default, muncul saat mengetik >= 1 karakter) -->
          <ul id="suggestionList" role="listbox"
            class="hidden absolute z-30 left-0 right-0 mt-1.5 max-h-56 overflow-y-auto rounded-xl border border-stone-200 bg-white p-1.5 shadow-xl shadow-stone-900/10 focus:outline-none text-sm animate-in fade-in zoom-in-95 duration-100">
          </ul>
        </div>

        <!-- 2. Kendala -->
        <div class="space-y-1.5">
          <label for="kendala" class="block text-xs font-semibold text-stone-600">
            Kendala <span class="text-emerald-700" aria-label="Wajib">*</span>
          </label>
          <textarea id="kendala" name="kendala" rows="3" required placeholder="Kendala atau hambatan yang dihadapi..."
            class="w-full rounded-xl border border-stone-300/80 bg-stone-50/60 hover:bg-stone-50 px-3.5 py-2.5 text-sm text-stone-900 placeholder:text-stone-400 transition focus:bg-white focus:border-emerald-700 focus:ring-0 resize-y"></textarea>
        </div>

        <!-- 3. Saran Solusi -->
        <div class="space-y-1.5">
          <label for="saranSolusi" class="block text-xs font-semibold text-stone-600">
            Saran Solusi <span class="text-emerald-700" aria-label="Wajib">*</span>
          </label>
          <textarea id="saranSolusi" name="saran_solusi" rows="3" required
            placeholder="Usulan atau alternatif solusi..."
            class="w-full rounded-xl border border-stone-300/80 bg-stone-50/60 hover:bg-stone-50 px-3.5 py-2.5 text-sm text-stone-900 placeholder:text-stone-400 transition focus:bg-white focus:border-emerald-700 focus:ring-0 resize-y"></textarea>
        </div>


        <!-- Alert Notifikasi Status Pengiriman -->
        <div id="statusAlert" class="hidden rounded-xl p-3.5 text-xs border transition-all" role="alert"
          aria-live="polite"></div>

        <!-- Aksi Tombol -->
        <div class="pt-2 flex flex-col-reverse sm:flex-row items-stretch sm:items-center justify-end gap-2.5">
          <button type="reset" id="btnReset"
            class="field-control px-4 py-2 text-xs font-medium text-stone-600 hover:text-stone-900 hover:bg-stone-100 rounded-xl transition cursor-pointer text-center">
            Reset Form
          </button>
          <button type="submit" id="btnSubmit"
            class="field-control px-5 py-2 text-xs font-medium text-white bg-emerald-800 hover:bg-emerald-900 active:bg-emerald-950 rounded-xl transition cursor-pointer text-center shadow-sm">
            Kirim Aspirasi
          </button>
        </div>

      </form>
    </div>

    <!-- Footer Ringkas -->
    <footer class="mt-6 text-center text-xs text-stone-400">
      PPMU-BAKID
    </footer>

  </main>

  <script>
    const form = document.getElementById('aspirasiForm');
    const instansiInput = document.getElementById('instansiInput');
    const clearInstansiBtn = document.getElementById('clearInstansiBtn');
    const suggestionList = document.getElementById('suggestionList');
    const autocompleteContainer = document.getElementById('autocompleteContainer');
    const quoteDisplay = document.getElementById('quoteDisplay');
    const statusAlert = document.getElementById('statusAlert');

    // Data Quotes
    const QUOTES_DATA = [
      {
        arabic: "وجـــــــوده كعــــــدمه، فالــــــعدم أولى",
        latin: ""
      },
      {
        arabic: "فكـــــــرة، عملـــــــية وحـــــــركة",
        latin: ""
      }
    ];

    let currentQuoteIndex = 0;

    function renderCurrentQuote(animate = true) {
      if (!quoteDisplay) return;
      const q = QUOTES_DATA[currentQuoteIndex];

      const html = q.arabic
        ? `<span class="font-arabic text-base sm:text-lg font-bold text-emerald-900/90 inline-block align-middle tracking-wider" dir="rtl" lang="ar">${q.arabic}</span>`
        : `<span class="text-xs sm:text-sm text-stone-600 font-medium tracking-wide">${q.latin}</span>`;

      if (animate) {
        quoteDisplay.classList.add('opacity-0');
        setTimeout(() => {
          quoteDisplay.innerHTML = html;
          quoteDisplay.classList.remove('opacity-0');
        }, 250);
      } else {
        quoteDisplay.innerHTML = html;
      }
    }

    // Render pertama langsung tanpa kedip
    renderCurrentQuote(false);

    // Berganti otomatis setiap 6 detik
    setInterval(() => {
      currentQuoteIndex = (currentQuoteIndex + 1) % QUOTES_DATA.length;
      renderCurrentQuote(true);
    }, 6000);

    // Daftar master riwayat / saran asrama & instansi
    const INSTANSI_SUGGESTIONS = [
      "IAIM",
      "MA Plus",
      "MA 2",
      "MTs 1",
      "MTs 2",
      "Asrama A",
      "Asrama B",
      "Asrama C",
      "Asrama D",
      "Asrama E",
      "Asrama F",
      "Asrama G"
    ];

    let activeSuggestionIndex = -1;

    function renderSuggestions(query) {
      const trimmed = query.trim().toLowerCase();

      // Kondisi 1: Kolom kosong = daftar sembunyi
      if (!trimmed) {
        hideSuggestions();
        clearInstansiBtn.classList.add('hidden');
        return;
      }

      clearInstansiBtn.classList.remove('hidden');

      // Filter daftar yang cocok
      const filtered = INSTANSI_SUGGESTIONS.filter(item =>
        item.toLowerCase().includes(trimmed)
      );

      // Jika tidak ada yang cocok sama sekali, jangan tampilkan list kosong
      if (filtered.length === 0) {
        hideSuggestions();
        return;
      }

      suggestionList.innerHTML = '';
      activeSuggestionIndex = -1;

      filtered.forEach((item, index) => {
        const li = document.createElement('li');
        li.setAttribute('role', 'option');
        li.setAttribute('tabindex', '0');
        li.className = 'suggestion-item flex items-center justify-between px-3.5 py-2.5 rounded-xl text-stone-800 hover:bg-emerald-50 hover:text-emerald-950 cursor-pointer transition select-none text-sm';

        // Highlight teks yang cocok
        const regex = new RegExp(`(${trimmed.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        const highlighted = item.replace(regex, '<span class="font-bold text-emerald-800 underline decoration-emerald-500/40">$1</span>');

        li.innerHTML = `
          <div class="flex items-center gap-2.5">
            <svg class="w-3.5 h-3.5 text-stone-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>${highlighted}</span>
          </div>
          <span class="text-[10px] uppercase font-semibold text-stone-400 tracking-wider">Pilih</span>
        `;

        li.addEventListener('click', () => {
          selectItem(item);
        });

        suggestionList.appendChild(li);
      });

      suggestionList.classList.remove('hidden');
    }

    function hideSuggestions() {
      suggestionList.classList.add('hidden');
      suggestionList.innerHTML = '';
      activeSuggestionIndex = -1;
    }

    function selectItem(name) {
      instansiInput.value = name;
      hideSuggestions();
      clearInstansiBtn.classList.remove('hidden');
      document.getElementById('kendala').focus();
    }

    // Event input mengetik (Kondisi 2)
    instansiInput.addEventListener('input', (e) => {
      renderSuggestions(e.target.value);
    });

    // Tombol bersihkan input
    clearInstansiBtn.addEventListener('click', () => {
      instansiInput.value = '';
      clearInstansiBtn.classList.add('hidden');
      hideSuggestions();
      instansiInput.focus();
    });

    // Navigasi keyboard pada input & list saran
    instansiInput.addEventListener('keydown', (e) => {
      const items = suggestionList.querySelectorAll('.suggestion-item');
      if (suggestionList.classList.contains('hidden') || items.length === 0) return;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeSuggestionIndex = (activeSuggestionIndex + 1) % items.length;
        updateActiveSuggestion(items);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeSuggestionIndex = (activeSuggestionIndex - 1 + items.length) % items.length;
        updateActiveSuggestion(items);
      } else if (e.key === 'Enter') {
        if (activeSuggestionIndex >= 0 && activeSuggestionIndex < items.length) {
          e.preventDefault();
          items[activeSuggestionIndex].click();
        }
      } else if (e.key === 'Escape') {
        hideSuggestions();
      }
    });

    function updateActiveSuggestion(items) {
      items.forEach((item, idx) => {
        if (idx === activeSuggestionIndex) {
          item.classList.add('bg-emerald-50', 'text-emerald-950');
          item.scrollIntoView({ block: 'nearest' });
        } else {
          item.classList.remove('bg-emerald-50', 'text-emerald-950');
        }
      });
    }

    // Klik di luar menutup dropdown saran
    document.addEventListener('click', (e) => {
      if (!autocompleteContainer.contains(e.target)) {
        hideSuggestions();
      }
    });

    form.addEventListener('reset', () => {
      statusAlert.classList.add('hidden');
      hideSuggestions();
      clearInstansiBtn.classList.add('hidden');
    });

    // Google Apps Script Web App URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyGTwg31l1GG5axqBKIjD-zj67sDP6jTroh7252Tzjpgp1E7RYvXKnP6n4JGI5HZB_bww/exec";

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const instansiValue = instansiInput.value.trim();
      const kendalaValue = document.getElementById('kendala').value.trim();
      const solusiValue = document.getElementById('saranSolusi').value.trim();

      if (!instansiValue) {
        showAlert('Silakan isi nama asrama atau instansi.', 'error');
        instansiInput.focus();
        return;
      }

      if (!kendalaValue) {
        showAlert('Kendala wajib diisi.', 'error');
        document.getElementById('kendala').focus();
        return;
      }

      if (!solusiValue) {
        showAlert('Saran Solusi wajib diisi.', 'error');
        document.getElementById('saranSolusi').focus();
        return;
      }

      const btnSubmit = document.getElementById('btnSubmit');
      const originalBtnText = btnSubmit.innerHTML;

      btnSubmit.disabled = true;
      btnSubmit.classList.add('opacity-70', 'cursor-not-allowed');
      btnSubmit.innerHTML = `
        <svg class="animate-spin -ml-0.5 mr-2 h-4 w-4 text-white inline" fill="none" viewBox="0 0 24 24" aria-hidden="true">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        <span>Mengirim...</span>
      `;

      try {
        const payload = {
          instansi: instansiValue,
          kendala: kendalaValue,
          saran_solusi: solusiValue,
          catatan_evaluasi: "-",
          timestamp: new Date().toLocaleString('id-ID')
        };

        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        });

        showAlert(`Aspirasi dari "${instansiValue}" berhasil terkirim dan disimpan!`, 'success');
        form.reset();
      } catch (err) {
        console.error('Pengiriman data aspirasi gagal:', err);
        showAlert('Terjadi kendala saat mengirim data. Silakan periksa koneksi internet Anda.', 'error');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.classList.remove('opacity-70', 'cursor-not-allowed');
        btnSubmit.innerHTML = originalBtnText;
      }
    });

    function showAlert(message, type) {
      statusAlert.textContent = message;
      statusAlert.className = 'rounded-2xl p-4 text-sm border font-medium transition-all ' +
        (type === 'success'
          ? 'bg-emerald-50 border-emerald-300 text-emerald-900'
          : 'bg-red-50 border-red-300 text-red-900');
      statusAlert.classList.remove('hidden');
      statusAlert.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Anti-zoom: cegah gesture pinch-to-zoom (Safari/iOS)
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    });

    // Anti-zoom: cegah double-tap to zoom di mobile
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (e) {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });
  </script>
</body>

</html>
